    <style>
      :root {
        --white: #ffffff;
        --ink: #1a1410;
        --orange: #e8742a;
        --pill-w: 200px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: #f4ece4;
      }

      body {
        font-family: "Urbanist", "Questrial", system-ui, sans-serif;
        color: var(--white);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Hero container */
      .hero {
        position: fixed;
        inset: 0;
        overflow: hidden;
        isolation: isolate;
        border-radius: 0;
        background: #b5571c url("https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261016_125845_ec7f8569-08dd-4a78-8310-9e094f5dd0a3.png") center / cover no-repeat;
      }

      /* z-index 0: Video */
      .hero__video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }

      /* z-index 1: Dual gradient shade */
      .hero__shade {
        pointer-events: none;
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(90deg, rgba(60, 22, 4, 0.38) 0%, rgba(60, 22, 4, 0.12) 28%, rgba(0, 0, 0, 0) 50%),
          linear-gradient(180deg, rgba(40, 14, 2, 0.18) 0%, rgba(0, 0, 0, 0) 16%);
      }

      /* z-index 2: 3D Canvas */
      #fox {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        opacity: 0;
        transition: opacity 1.2s ease;
        z-index: 2;
      }
      #fox.is-ready {
        opacity: 1;
      }

      /* Entrance Animation */
      @keyframes rise {
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* z-index 8: Top Nav */
      .nav {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 8;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 17px 20px 0 20px;
        opacity: 0;
        transform: translateY(14px);
        animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
        animation-delay: 0.1s;
      }

      .nav__links {
        display: flex;
        align-items: center;
        gap: 32px;
        font-family: "Questrial", sans-serif;
        font-size: 13.5px;
        letter-spacing: 0.01em;
      }

      .nav__links a {
        color: var(--white);
        text-decoration: none;
        opacity: 0.95;
        transition: opacity 0.2s ease;
        cursor: pointer;
      }

      .nav__links a:hover {
        opacity: 0.7;
      }

      .toggle {
        width: 35px;
        height: 17px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.28);
        border: none;
        margin: 0 -2px;
        position: relative;
        cursor: pointer;
        padding: 0;
        display: inline-block;
      }

      .toggle::before,
      .toggle::after {
        content: "";
        position: absolute;
        top: 2px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #ffffff;
      }

      .toggle::before {
        left: 2px;
      }

      .toggle::after {
        left: 11px;
        opacity: 0.55;
      }

      /* Brand pill */
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 44px;
        padding: 0 16px 0 6px;
        background: #ffffff;
        border-radius: 999px;
        color: var(--ink);
        box-shadow: 0 6px 24px rgba(80, 30, 0, 0.12);
        position: relative;
        z-index: 2;
        transition: box-shadow 0.5s ease;
      }

      .is-menu-open .brand {
        box-shadow: 0 0 0 transparent;
      }

      .brand__logo {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--orange);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .brand__name {
        font-family: "Questrial", sans-serif;
        font-size: 13px;
        letter-spacing: 0.62em;
        padding-left: 6px;
        margin-right: 6px;
        white-space: nowrap;
      }

      .brand__menu {
        width: 28px;
        height: 28px;
        margin-right: -6px;
        background: transparent;
        border: none;
        border-radius: 50%;
        position: relative;
        cursor: pointer;
        padding: 0;
        transition: background 0.3s;
      }

      .brand__menu:hover {
        background: rgba(26, 20, 16, 0.06);
      }

      .brand__menu span {
        position: absolute;
        left: 6px;
        width: 16px;
        height: 1.6px;
        background-color: var(--ink);
        border-radius: 2px;
        transition: transform 0.55s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.3s, width 0.45s cubic-bezier(0.76, 0, 0.24, 1);
      }

      .brand__menu span:nth-child(1) {
        top: 8.6px;
      }

      .brand__menu span:nth-child(2) {
        top: 13.2px;
      }

      .brand__menu span:nth-child(3) {
        top: 17.8px;
      }

      .brand__menu:hover span:nth-child(2) {
        width: 11px;
      }

      .is-menu-open .brand__menu span:nth-child(1) {
        transform: translateY(4.6px) rotate(45deg);
      }

      .is-menu-open .brand__menu span:nth-child(2) {
        transform: scaleX(0);
        opacity: 0;
        width: 16px;
      }

      .is-menu-open .brand__menu span:nth-child(3) {
        transform: translateY(-4.6px) rotate(-45deg);
      }

      /* z-index 5: Headline */
      .headline {
        position: absolute;
        left: 18px;
        top: 46%;
        z-index: 5;
        font-family: "Questrial", sans-serif;
        font-weight: 400;
        font-size: clamp(30px, 2.95vw, 44px);
        line-height: 0.98;
        letter-spacing: -0.005em;
        color: #ffffff;
        text-shadow: 0 2px 18px rgba(70, 25, 0, 0.25);
        pointer-events: none;
      }

      .headline span {
        display: block;
        width: max-content;
        opacity: 0;
        transform: translateY(14px);
        animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }

      .headline span:nth-child(1) {
        animation-delay: 0.25s;
      }

      .headline span:nth-child(2) {
        animation-delay: 0.35s;
      }

      .headline span:nth-child(3) {
        animation-delay: 0.45s;
      }

      .headline span:nth-child(4) {
        animation-delay: 0.55s;
      }

      .headline .u {
        text-decoration: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: 6px;
      }

      .headline .indent {
        margin-left: 3.5em;
      }

      /* z-index 6: Menu Backdrop */
      .menu-backdrop {
        position: absolute;
        inset: 0;
        z-index: 6;
        background: rgba(48, 18, 2, 0.28);
        -webkit-backdrop-filter: blur(0px);
        backdrop-filter: blur(0px);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.6s ease, -webkit-backdrop-filter 0.8s ease, backdrop-filter 0.8s ease, visibility 0s 0.8s;
      }

      .is-menu-open .menu-backdrop {
        opacity: 1;
        visibility: visible;
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        transition: opacity 0.6s ease, -webkit-backdrop-filter 0.8s ease, backdrop-filter 0.8s ease, visibility 0s;
      }

      /* z-index 7: Menu Panel */
      .menu {
        position: absolute;
        z-index: 7;
        top: 17px;
        right: 20px;
        width: min(400px, calc(100vw - 32px));
        padding: 76px 30px 26px;
        background: var(--white);
        color: var(--ink);
        border-radius: 24px;
        box-shadow: 0 30px 80px -20px rgba(70, 25, 0, 0.45);
        clip-path: inset(0 0 calc(100% - 44px) calc(100% - var(--pill-w)) round 22px);
        visibility: hidden;
        transition: clip-path 0.75s cubic-bezier(0.76, 0, 0.24, 1), visibility 0s 0.75s;
      }

      .is-menu-open .menu {
        clip-path: inset(0 0 0 0 round 24px);
        visibility: visible;
        transition: clip-path 0.85s cubic-bezier(0.76, 0, 0.24, 1), visibility 0s;
      }

      .menu__list {
        list-style: none;
      }

      .menu__item {
        overflow: hidden;
        border-bottom: 1px solid rgba(26, 20, 16, 0.08);
      }

      .menu__link {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 12px 0 10px;
        color: var(--ink);
        text-decoration: none;
        font-family: "Questrial", sans-serif;
        font-size: 34px;
        line-height: 1.05;
        letter-spacing: -0.01em;
        transform: translateY(110%);
        transition: transform 0.5s cubic-bezier(0.76, 0, 0.24, 1), color 0.3s;
        cursor: pointer;
      }

      .is-menu-open .menu__link {
        transform: none;
        transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.3s;
      }

      .is-menu-open .menu__item:nth-child(1) .menu__link {
        transition-delay: 0.32s, 0s;
      }
      .is-menu-open .menu__item:nth-child(2) .menu__link {
        transition-delay: 0.38s, 0s;
      }
      .is-menu-open .menu__item:nth-child(3) .menu__link {
        transition-delay: 0.44s, 0s;
      }
      .is-menu-open .menu__item:nth-child(4) .menu__link {
        transition-delay: 0.50s, 0s;
      }
      .is-menu-open .menu__item:nth-child(5) .menu__link {
        transition-delay: 0.56s, 0s;
      }

      .menu__link:hover {
        color: var(--orange);
      }

      .menu__link small {
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--orange);
        transform: translateY(-14px);
        display: inline-block;
        font-weight: 500;
      }

      .menu__link .arrow {
        margin-left: auto;
        font-size: 20px;
        opacity: 0;
        transform: translateX(-10px);
        transition: opacity 0.3s, transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1);
        display: inline-block;
      }

      .menu__link:hover .arrow {
        opacity: 1;
        transform: none;
      }

      .menu__foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 26px;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.3s, transform 0.4s;
      }

      .is-menu-open .menu__foot {
        opacity: 1;
        transform: none;
        transition: opacity 0.6s 0.62s, transform 0.8s 0.62s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .menu__cta {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 8px 0 20px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--white);
        font-family: "Questrial", sans-serif;
        font-size: 14px;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
      }

      .menu__cta i {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--orange);
        display: grid;
        place-items: center;
        font-style: normal;
        color: var(--ink);
        font-size: 14px;
        transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .menu__cta:hover i {
        transform: rotate(-45deg);
      }

      .menu__social {
        display: flex;
        gap: 14px;
        font-size: 12.5px;
      }

      .menu__social a {
        color: rgba(26, 20, 16, 0.6);
        text-decoration: none;
        transition: color 0.3s;
      }

      .menu__social a:hover {
        color: var(--ink);
      }

      /* Mobile styles (max-width: 720px) */
      @media (max-width: 720px) {
        .nav {
          padding: 14px 16px 0;
        }

        .nav__links {
          gap: 16px;
          font-size: 12.5px;
        }

        .hide-sm {
          display: none !important;
        }

        .brand {
          height: 38px;
          gap: 10px;
          padding: 0 12px 0 4px;
        }

        .brand__logo {
          width: 28px;
          height: 28px;
        }

        .brand__name {
          letter-spacing: 0.42em;
          font-size: 12px;
        }

        .headline {
          top: auto;
          bottom: 64px;
          left: 16px;
          font-size: 34px;
        }

        .menu {
          top: 14px;
          right: 16px;
          padding: 66px 22px 22px;
          clip-path: inset(0 0 calc(100% - 38px) calc(100% - var(--pill-w)) round 19px);
        }

        .menu__link {
          font-size: 28px;
        }
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .nav,
        .headline span {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>

    <!-- Menu Interaction Script -->
    <script>
      (() => {
        const hero = document.querySelector('.hero');
        const brand = document.querySelector('.brand');
        const menu = document.getElementById('menu');
        const menuBtn = document.querySelector('.brand__menu');
        const backdrop = document.querySelector('.menu-backdrop');
        const menuLinks = document.querySelectorAll('.menu a, .menu button');

        function updatePillWidth() {
          if (brand && menu) {
            const w = brand.offsetWidth;
            document.documentElement.style.setProperty('--pill-w', w + 'px');
            menu.style.setProperty('--pill-w', w + 'px');
          }
        }

        updatePillWidth();
        window.addEventListener('resize', updatePillWidth);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(updatePillWidth);
        }

        // All menu links start with tabIndex -1
        menuLinks.forEach((link) => {
          link.setAttribute('tabindex', '-1');
        });

        function toggle(open) {
          const isOpen = typeof open === 'boolean' ? open : !hero.classList.contains('is-menu-open');
          if (isOpen) {
            hero.classList.add('is-menu-open');
            menuBtn.setAttribute('aria-expanded', 'true');
            menuBtn.setAttribute('aria-label', 'Close menu');
            menuLinks.forEach((link) => link.setAttribute('tabindex', '0'));
          } else {
            hero.classList.remove('is-menu-open');
            menuBtn.setAttribute('aria-expanded', 'false');
            menuBtn.setAttribute('aria-label', 'Open menu');
            menuLinks.forEach((link) => link.setAttribute('tabindex', '-1'));
          }
        }

        menuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggle();
        });

        if (backdrop) {
          backdrop.addEventListener('click', () => toggle(false));
        }

        menuLinks.forEach((link) => {
          link.addEventListener('click', () => toggle(false));
        });

        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && hero.classList.contains('is-menu-open')) {
            toggle(false);
          }
        });
      })();
    </script>

    <!-- 3D Fox Scene Module Script -->
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

      const canvas = document.getElementById('fox');
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();
      scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

      const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 6);

      // Warm lights
      const hemiLight = new THREE.HemisphereLight(0xffe2c0, 0x6b3a12, 1.1);
      scene.add(hemiLight);

      const dirLight1 = new THREE.DirectionalLight(0xffc98a, 2.2);
      dirLight1.position.set(-3, 4, 3);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffa24d, 1.6);
      dirLight2.position.set(3, 2, -3);
      scene.add(dirLight2);

      const pivot = new THREE.Group();
      scene.add(pivot);

      let baseX = 0.05;
      let baseY = 0.05;

      function layout() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        const mobile = width < 720;
        baseX = mobile ? 0 : 0.05;
        baseY = mobile ? 0.45 : 0.05;

        const aspect = width / height;
        const pivotScale = mobile ? 0.62 : Math.min(1, Math.max(0.75, aspect / 1.78));
        pivot.scale.setScalar(pivotScale);
      }

      window.addEventListener('resize', layout);

      const target = { x: 0, y: 0 };
      const look = { x: 0, y: 0 };

      window.addEventListener('pointermove', (e) => {
        target.x = (e.clientX / window.innerWidth) * 2 - 1;
        target.y = -(e.clientY / window.innerHeight) * 2 + 1;
      });

      const loader = new GLTFLoader();
      const modelUrl = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261016_125948_52f145de-4509-41e1-9289-523cf0ac9c86.glb';

      loader.load(
        modelUrl,
        (gltf) => {
          const box = new THREE.Box3().setFromObject(gltf.scene);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          gltf.scene.position.sub(center);

          const holder = new THREE.Group();
          const maxDim = Math.max(size.x, size.y, size.z);
          holder.scale.setScalar(3.15 / maxDim);
          holder.add(gltf.scene);
          pivot.add(holder);

          const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
          gltf.scene.traverse((child) => {
            if (child.isMesh && child.material) {
              child.material.envMapIntensity = 0.7;
              if (child.material.map) {
                child.material.map.anisotropy = maxAnisotropy;
              }
            }
          });

          layout();
          canvas.classList.add('is-ready');
        },
        undefined,
        (err) => {
          console.error('Failed to load GLTF model:', err);
        }
      );

      layout();

      const clock = new THREE.Clock();
      const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

      function animate() {
        requestAnimationFrame(animate);

        look.x += (target.x - look.x) * 0.04;
        look.y += (target.y - look.y) * 0.04;

        const prefersReducedMotion = motionQuery.matches;

        if (prefersReducedMotion) {
          pivot.position.set(baseX + look.x * 0.06, baseY, 0);
          pivot.rotation.z = 0;
          pivot.rotation.y = look.x * 0.22;
          pivot.rotation.x = look.y * 0.1;
        } else {
          const t = clock.getElapsedTime();
          const bob = Math.sin(t * 2.2) * 0.09;
          pivot.position.set(baseX + look.x * 0.06, baseY + bob, 0);
          pivot.rotation.z = Math.sin(t * 2.2 + 0.6) * 0.025;
          pivot.rotation.y = look.x * 0.22 + Math.sin(t * 0.9) * 0.05;
          pivot.rotation.x = look.y * 0.1 + Math.cos(t * 2.2) * 0.02;
        }

        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
